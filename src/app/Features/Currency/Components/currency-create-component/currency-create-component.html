<div class="container">
    <div class="card">
        <div class="card-header">
            <h3 class="text-primary">Currency Create</h3>
        </div>
        <div class="card-body">
            <form action="" [formGroup]="CurrencyForm" (submit)="submit()">
                <div class="row">
                  <div class="col col-6">
                      <div class="form-group mb-3">
                          <label for="name" class="form-label">Name</label>
                          <input type="text" formControlName="name" class="form-control">
                        </div>
                    </div>
                    <div class="col col-6">
                        <div class="form-group  mb-3">
                            <label for="code" class="form-label">Code</label>
                            <input type="text" formControlName="code" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col col-4">
                        <div class="form-check  mb-3">
                            <label for="status" class="form-label">status</label>
                            <input type="checkbox" formControlName="status" class="form-check-input">
                        </div>
                </div>
                <div class="col col-4">
                    <div class="form-check  mb-3">
                        <label for="defaultCurrency" class="form-label">Is Default Currency</label>
                        <input type="checkbox" formControlName="defaultCurrency" class="form-check-input">
                    </div>
                </div>
                <div class="col col-4">
                    <div class="form-check  mb-3">
                        <label for="baseCurrency" class="form-label">Is Base Currency</label>
                        <input type="checkbox" formControlName="baseCurrency" class="form-check-input">
                    </div>
                </div>
                </div>
                <div class="row">
                    <div class="col col-6">
                        <button class="btn btn-primary m-1">Save</button>
                        <button class="btn btn-secondary m-1" [routerLink]="['/CurrencyPage','CurrencyListPage']">Cancel</button>
                        <button class="btn btn-warning m-1" (click)="clearForm()">Clear</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
