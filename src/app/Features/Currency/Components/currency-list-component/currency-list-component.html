<div class="container">
    <div class="card">
        <div class="card-header">
            <h3 class="text-primary">Currencies</h3>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover table-bordered">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Code</th>
                        <th>Status</th>
                        <th>Is Default Currency</th>
                        <th>Is Base Currency</th>
                    </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let Currency of Currencies ;let index">
                    <td>
                       <a [routerLink]="['/CurrencyPage/CurrencyDetailPage/',Currency.id]" class="nav-link">{{Currency.name}}</a> 
                    </td>
                    <td>{{Currency.code}}</td>
                    <td>{{Currency.status?"true":"false"}}</td>
                    <td>{{Currency.defaultCurrency?"true":"false"}}</td>
                    <td>{{Currency.baseCurrency?"true":"false"}}</td>
                  </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <h6 class="text-info">
                records : {{Currencies.length}}
            </h6>
        </div>
    </div>
</div>
