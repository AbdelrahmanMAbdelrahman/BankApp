<div class="container">
    <div class="row">
        <div class="col col-12">
            <div class="card">
                <div class="card-header">
                    <h1 class="justiy-content-center">student form</h1>
                </div>
                <div class="card-body">
                    <form action="" [formGroup]="studentForm"  (submit)="saveStudent()">
                        <div class="form-group mb-3">
                            <label for="name"  class="form-label">name</label>
                            <input type="text" formControlName="name" id="name" class="form-control">
                        </div>
                        <div class="form-group mb-3">
                            <label for="email"  class="form-label">email</label>
                            <input type="email" formControlName="email" id="email" class="form-control">
                        </div>
                        <div class="form-group mb-3">
                            <label for="phone"  class="form-label">phone</label>
                            <input type="tel" formControlName="phone" id="phone" class="form-control">
                        </div>
                        <div class="form-group mb-3">
                            <label for="age"  class="form-label">age</label>
                            <input type="number" formControlName="age" id="age" class="form-control">
                        </div>
                        <input class="btn btn-primary" type="submit" disabled="!studentForm.valid && studentForm.touched">
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
