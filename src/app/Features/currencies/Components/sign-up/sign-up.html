<div class="container">
    <div class="row">
        <div class="col-md-12">
            <form action="" (submit)="submit()"[formGroup]="signUp">
                <div class="form-group" formGroupName="userData">

                    <div class="form-group">
                        <label for="username" class="form-label">username</label>
                        <input type="text" formControlName="username" id="username" class="form-control">
                    </div>
                    
                    <span *ngIf="!signUp.get('userData.username')?.valid && signUp.get('userData.username')?.touched" class="help-block">
                        <span *ngIf="signUp.get('userData.username')?.errors?.['forbiddenUserName']">this name is forbidden</span>
                        <span *ngIf="signUp.get('userData.username')?.errors?.['required']">this field is required</span>
                        <!-- username can't be empty -->
                    </span>
                    <div class="form-group">
                        <label for="email" class="form-label">email</label>
                        <input  type="email" formControlName="email" id="email" class="form-control">
                    </div>
                    <span *ngIf="!signUp.get('userData.email')?.valid && signUp.get('userData.email')?.touched" class="help-block">email can't be empty</span>
                </div>
                <div formArrayName="hobbies">
                 
                    <h4 class="text-info">Your Hobbies</h4>
                    <button class="btn btn-default" type="button" (click)="addHobby()">Add Hobby</button>
                    <div class="form-group" *ngFor="let control of controls let i = index">
                        <input class="form-control" [formControlName]="i" type="text">
                    </div>
                </div>
                <div class="form-group" *ngFor="let gender of genderList">
                    <label for="username" class="form-label">
                        <input  type="radio" formControlName="gender" [value]="gender">{{gender}}
                    </label>
                     
                </div>
                <input [disabled]="!signUp.valid" type="submit" class="btn btn-primary">
            </form>
        </div>
    </div>
</div>
