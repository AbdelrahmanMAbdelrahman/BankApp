<div class="container bg-secondary" style="width: 85vw;">
    <div class="card">
        <div class="card-header">
            <h1 class="text-light">party Details</h1>
            <button class="btn btn-secondary m-3" [routerLink]="['/partyPage/partyCreatePage/',party.id]">Edit</button>
            <button class="btn btn-danger m-3" (click)="deleteParty(party.id)">Delete</button>
        </div>
        <div class="card-body">
            <form action="" [formGroup]="partyForm">
             <div class="row">
                 <div class="form-group col-4">
                     <label for="name" class="from-label">Name</label>
                     <input type="text" id="name" formControlName="name" class="form-control">
                </div>
                    <div class="form-group col-4">
                        <label for="nativeName" class="from-label">Native Name</label>
                        <input type="text" id="nativeName" formControlName="nativeName" class="form-control">
                    </div>
                    <div class="form-group col-4">
                        <label for="partyCode" class="from-label">Party Code</label>
                        <input type="text" id="partyCode" formControlName="partyCode" class="form-control">
                    </div>
            </div>
             <div class="row">
                 <div class="form-group col-4">
                     <label for="internalCode" class="from-label">Internal Code</label>
                     <input type="text" id="internalCode" formControlName="internalCode" class="form-control">
                </div>
                    <div class="form-group col-4">
                        <label for="partyGroupName" class="from-label">Party Group Name</label>
                        <input type="text" id="partyGroupName" formControlName="partyGroupName" class="form-control">
                    </div>
                    <div class="form-group col-4">
                        <label for="active" class="from-label">Active</label>
                        <input type="checkbox" id="partyCode" formControlName="active" class="form-check-box">
                    </div>
            </div>
            </form>
        </div>
    </div>
</div>
