<div class="justify-content-between align-items-center d-flex bg-secondary p-3 mt-3">
    <h3 class="text-white mb-0">Employees</h3>
    <button class="btn btn-primary">Export</button>
</div>
<div class="table-responsive">
<table class="table table-bordered table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th>Name</th>
        <th>Department</th>
        <th>Reports to name</th>
        <th>Email</th>
        <th>Primary Phone</th>
        <th>Employee Status</th>
        <th>User Name</th>
    </tr>
    </thead>
       <tbody>
    <tr *ngFor="let emp of response?.value">
        <td><a [routerLink]="['../employeeDetailPage',emp.id]">{{emp.fName + ''+emp.lName}}</a> </td>
        <td>{{emp.department}}</td>
        <td>S{{emp.reportsTo}}</td>
        <td>{{emp.email}}</td>
        <td>{{emp.mobilePhone}}</td>
        <td>{{emp.status}}</td>
        <td>{{emp.userName}}</td>
    </tr>
