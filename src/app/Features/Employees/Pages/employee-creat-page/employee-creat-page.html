<div class="employee-form">
    <app-employee-form
    [Employee]="employee.value"
      (OnSaveEmployee)="saveEmployee($event)"></app-employee-form>
</div>
}@else{
 <div class="employee-form">
    <app-employee-form  (OnSaveEmployee)="saveEmployee($event)"></app-employee-form>
</div>   
}
