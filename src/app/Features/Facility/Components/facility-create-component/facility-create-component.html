<div class="container">
    <div class="card">
        <form action="" [formGroup]="facilityForm!" (submit)="saveFacility()">
        <div class="card-header">
            <h6 class="text-primar">Create Facility</h6>
        </div>
        <div class="card-body">

                <div class="row">
                <div class="form-group col-3">
                    <label for="accountNumber" class="form-label">Account Number</label>
                    <input type="text" class="form-control" formControlName="accountNumber">
                    <span *ngIf="AccountNumber?.touched&&AccountNumber?.invalid" class="text text-danger">must provide account number</span>
                </div>
                <div class="form-group col-3">
                    <label for="party" class="form-label">Party</label>
                   <select name="party" id="party" class="form-select" formControlName="party">
                    <option *ngFor="let party of parties" [value]="party.id">{{party.name}}</option>
                    </select>
                    <span *ngIf="Party?.touched&&Party?.invalid" class="text text-danger">must provide account number</span>

                </div>
                <div class="form-group col-3">
                    <label for="currency" class="form-label">Currency</label>
                    <select  name="currency" id="currency" class="form-select" formControlName="currency">
                        <option *ngFor="let currency of currencies" [value]="currency.id">{{currency.name}}</option>
                    </select>
                    <span *ngIf="Currency?.touched&&Currency?.invalid" class="text text-danger">must provide account number</span>

                </div>
                <div class="form-group col-3">
                    <label for="facilityType" class="form-label">Facility Type</label>
                    <select name="facilityType" id="facilityType" formControlName="facilityType" class="form-select">
                        <option value=1>With Resource</option>
                        <option value=2>Risk </option>
                    </select> 
                    <span *ngIf="FacilityType?.touched&&FacilityType?.invalid" class="text text-danger">must provide account number</span>

                </div>
            </div>
        </div>
        <div class="card-footer">
            <div class="d-flex justify-content-end">
                <button [disabled]="!facilityForm?.valid" class="btn btn-primary m-1" type="submit">Save</button>
                <button class="btn btn-secondary m-1" type="button">Cancel</button>
            </div>
        </div>
    </form>
    </div>
</div>
