    <div class="card">
<div class="card-header">
    <h6 class="text-primary">Facilities</h6>
</div>

<div class="card-body">

    <table class="table table-hover table-striped">
        <thead>
            <tr>
                    <th>Account Number</th>
                    <th>Currency</th>
                    <th>Party</th>
                    <th>Facility Type</th>
                </tr>
            </thead>        
            <tbody>
                <tr *ngFor="let facility of paginated.items">
                    <td>
                <a [routerLink]="['/FacilityPage','FacilityDetailPage',facility.id]" class="nav-link">{{facility.accountNumber}}</a>
            </td>
            <td>{{facility.currencyName}}</td>
            <td>{{facility.partyName}}</td>
            <td>{{FacilityType[ +facility.facilityType]}}</td>
               </tr>

           </tbody>
</table>

</div>

<div class="card-footer">
    <div class="d-flex justify-content-between">
<div class="col col-3">

    <h3 class="text-info">
        count : {{paginated.items.length}}
    </h3>
</div>
<div class="d-flex justify-content-end mb-1">
    <button 
    class="btn btn-outline-primary"
    [disabled]="paginated.pageNumber===1"
    (click)="getPrevious()">
        Previous
    </button>
    <span class="align-self-center">
         Page {{paginated.totalPages}} / {{paginated.pageNumber}}
    </span>
    <button 
    class="btn btn-outline-primary"
    [disabled]="paginated.pageNumber===paginated.totalPages"
    (click)="getNext()">
        Next
    </button>
</div>
        
</div>

</div>
</div>
